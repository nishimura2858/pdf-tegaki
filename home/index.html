<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f2f2f0">
<title>ホーム切替</title>
<style>
  body{margin:0;display:grid;place-items:center;min-height:100vh;font-family:sans-serif;background:#f2f2f0;color:#111}
  main{width:100%;max-width:420px;padding:16px;box-sizing:border-box}
  h1{font-size:18px;font-weight:600;text-align:center;margin:0 0 8px;color:#444}
  a.btn{display:block;margin:12px 0;padding:24px 16px;font-size:20px;font-weight:600;text-align:center;border:2px solid #333;border-radius:16px;color:#111;text-decoration:none;background:#fff;-webkit-tap-highlight-color:transparent}
  a.btn:active{background:#e6e6e2}
  a.sub{font-size:16px;font-weight:400;padding:16px;border-color:#888}
  @media (prefers-color-scheme:dark){
    body{background:#1b1b1a;color:#eee}
    h1{color:#aaa}
    a.btn{background:#2a2a28;color:#eee;border-color:#ccc}
    a.btn:active{background:#3a3a37}
    a.sub{border-color:#777}
  }
</style>
</head>
<body>
<main>
  <h1>ホームアプリの切り替え</h1>
  <a class="btn" href="intent:#Intent;action=android.settings.HOME_SETTINGS;end">ホームアプリの設定を開く</a>
  <a class="btn sub" href="intent:#Intent;action=android.settings.MANAGE_DEFAULT_APPS_SETTINGS;end">予備：デフォルトのアプリを開く</a>
</main>
</body>
</html>
